name: seamm-xnn
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # pymdi comes from conda-forge, deliberately NOT from pip. Only the
  # conda-forge build links the MDI library against MPI, which the `-method
  # MPI` launch used for LAMMPS QM-MD needs; the PyPI wheel bundles an
  # MPI-stub build and MDI_Init then dies with "Failed to initialize MPI".
  # conda-forge's package also ships no `.dist-info`, so pip cannot see it and
  # a pip `pymdi` silently overwrites it in a shared environment.
  - pymdi          # provides `import mdi` for the MDI engine
  - pip:
    # PyTorch is deliberately NOT listed here. `xnn-step-installer` installs it
    # itself, from the PyTorch index that matches the machine's NVIDIA driver
    # (the wheels bundle their CUDA runtime, so the driver decides which build
    # runs; PyPI's default wheel bundles the newest runtime, which an older
    # driver cannot use -- torch then silently runs on the CPU). A conda
    # `pytorch` must never appear above either: conda-forge resolves it to the
    # CPU-only build on Linux and installs it over a pip CUDA torch. The
    # installer applies this pip section on torch's index, so nothing here can
    # pull in a different torch. To force a build, set `torch-build = cu128`
    # (or cpu, default) in xnn.ini or run the installer with --torch-tag.
    - e3nn==0.4.4    # for the equivariant models (MACE, NequIP, Allegro)
    # vesin-torch gives fast cell-list neighbor lists for large systems on cpu/cuda, but
    # it forces float64 and so breaks Apple's mps device; add it yourself if wanted.
    # - vesin-torch
    # The xnn code is published on PyPI under the name `xnns` (the name `xnn` is
    # an orphaned project awaiting transfer); the import name and the `xnn`
    # command are unchanged. 0.4.0 or later: releases 0.2.1 and 0.3.0 added
    # `scale_shift` buffers to the MACE model with no defaults for older state
    # dicts, so every checkpoint trained before them failed to load; 0.4.0 has the
    # defaults, and `xnn mdi --eeq-reuse`. xnns needs only torch>=2.0, so the
    # torch the installer chose for the machine satisfies it and is kept.
    - xnns>=0.4.0
