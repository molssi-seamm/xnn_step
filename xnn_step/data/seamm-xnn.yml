name: seamm-xnn
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # pymdi comes from conda-forge, deliberately NOT from pip. Only the
  # conda-forge build links the MDI library against MPI, which the `-method
  # MPI` launch used for LAMMPS QM-MD needs; the PyPI wheel bundles an
  # MPI-stub build and MDI_Init then dies with "Failed to initialize MPI".
  # conda-forge's package also ships no `.dist-info`, so pip cannot see it and
  # a pip `pymdi` silently overwrites it in a shared environment.
  - pymdi          # provides `import mdi` for the MDI engine
  - pip:
    # PyTorch is installed with pip, deliberately NOT with conda. The
    # conda-forge `pytorch` package resolves to the CPU-only `cpu_generic`
    # build on Linux, and `conda env update` with this file will install it
    # straight over a pip CUDA build of torch: the GPU silently disappears and
    # every compiled extension built against the pip ABI (vesin-torch,
    # cuequivariance, ...) stops loading with "undefined symbol". The pip
    # wheels are CUDA-enabled on Linux and MPS-enabled on macOS, and pip
    # leaves an existing torch alone if it already satisfies this requirement.
    # For a specific CUDA version install torch by hand, following
    # https://pytorch.org, e.g.
    #     pip install torch --index-url https://download.pytorch.org/whl/cu126
    - torch
    - e3nn==0.4.4    # for the equivariant models (MACE, NequIP, Allegro)
    # vesin-torch gives fast cell-list neighbor lists for large systems on cpu/cuda, but
    # it forces float64 and so breaks Apple's mps device; add it yourself if wanted.
    # - vesin-torch
    # The xnn code is published on PyPI under the name `xnns` (the name `xnn` is
    # an orphaned project awaiting transfer); the import name and the `xnn`
    # command are unchanged. Releases 0.2.1 and 0.3.0 added `scale_shift`
    # buffers to the MACE model with no defaults for older state dicts, so every
    # checkpoint trained before them fails to load ("Missing key(s) in
    # state_dict: model.model.scale_shift.scale/shift"). Stay on 0.1.x until a
    # release provides the defaults; existing environments need
    #     pip install xnns==0.1.0
    - xnns<0.2
