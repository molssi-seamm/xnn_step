# Configuration options for how to run xnn machine-learned force fields (MLFFs)
# as MDI engines for SEAMM.
#
# The xnn plug-in does not run a standalone step: it advertises the xnn
# checkpoints it finds to the Model Chemistry step, and launches the `xnn mdi`
# engine when a step such as Energy or LAMMPS drives that model chemistry.

[local]
# The type of local installation to use. Options are:
#     conda: Use a conda environment
#     local: Use a local installation (the `code` below must be on the path or
#            a full path to the `xnn` command)

installation = conda

# For a conda installation, the conda executable and the environment holding
# xnn (with PyTorch, e3nn and pymdi). `xnn-step-installer` creates the
# environment `seamm-xnn` from the plug-in's seamm-xnn.yml.

# conda = /path/to/conda
conda-environment = seamm-xnn

# The command to run xnn.

code = xnn

# The PyTorch device the MDI engine evaluates the model on: cpu, cuda, cuda:0,
# mps, ... A GPU is much faster for large systems; for a few atoms cpu is fine.

device = cpu

# The directories searched (not recursively) for xnn checkpoints, one per line.
# Every file matching the pattern below is advertised to the Model Chemistry
# step as `xnn:MLFF@<file stem>`. `{root}` is the SEAMM root (~/SEAMM by default).

models = {root}/data/Forcefields/xnn

# The glob pattern for checkpoint files in those directories.

pattern = *.pt
